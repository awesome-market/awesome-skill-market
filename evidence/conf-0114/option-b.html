<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Option B</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#fff;background:#000}
.hero{height:100vh;background:#1e3a5f;display:flex;align-items:flex-end;padding:8%}
.hero h1{font-size:2.6rem;max-width:40ch;margin-bottom:1rem}
.hero p{max-width:36ch;opacity:.95}
.section{height:100vh;background:#0a1a2f;display:flex;align-items:center;padding:8%}
.section h2{font-size:2rem;margin-bottom:.6rem}
.section p{max-width:44ch;color:#cfd8e3;line-height:1.5}
.photo{position:absolute;inset:0;background:#3a6ea5;opacity:.35}
.caption{position:fixed;left:0;bottom:0;background:#000;color:#fff;padding:.5rem 1rem;font-size:.85rem;letter-spacing:.02em}
</style></head>
<body>
<section class="hero">
<div class="photo" role="img" aria-label="Full-bleed edge-to-edge photograph behind the hero"></div>
<h1>Images That Fill the Frame</h1>
<p>Edge-to-edge photography becomes the dominant visual element, carrying the whole page.</p>
</section>
<section class="section">
<div class="photo" role="img" aria-label="Full-bleed edge-to-edge photograph behind the second section"></div>
<h2>Every Section, Dominant</h2>
<p>Photographs bleed to every edge and lead each section, with text floating above the imagery.</p>
</section>
<div class="caption">OPTION B — full-bleed dominant photography</div>
</body></html>
