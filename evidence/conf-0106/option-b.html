<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Option B</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#1a1a1a;color:#f5f5f5;height:800px}
.wrap{max-width:900px;margin:0 auto;padding:40px}
h1{margin:0 0 8px;font-size:28px}
p{margin:0 0 32px;color:#b0b0b0}
.card{background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:24px;margin-bottom:24px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
button,.link{font:inherit;padding:10px 18px;border-radius:6px;cursor:pointer;border:2px solid transparent;background:#3a3a3a;color:#f5f5f5;text-decoration:none;display:inline-block}
button:hover,.link:hover{background:#4a4a4a}
/* B: focus-visible only — NO ring in resting state */
button:focus-visible,.link:focus-visible{outline:3px solid #00e0ff;outline-offset:3px}
/* B: click/active state keeps NO ring — outline removed, no replacement */
button:active,.link:active{background:#555;outline:none}
.caption{position:fixed;left:16px;bottom:16px;background:#000;color:#00e0ff;padding:6px 12px;border:1px solid #00e0ff;border-radius:4px;font-size:13px}
</style></head>
<body>
<div class="wrap">
<h1>Dashboard</h1>
<p>Focus rings appear only via focus-visible — resting elements show no ring, and click states drop the outline entirely.</p>
<div class="card">
<div class="row">
<button>Save changes</button>
<a class="link" href="#">Reset defaults</a>
<button>Export report</button>
</div>
</div>
<div class="card">
<p>Resting state shows no ring — the ring is reserved for keyboard focus only.</p>
</div>
</div>
<div class="caption">OPTION B — focus-visible ring only</div>
</body></html>
