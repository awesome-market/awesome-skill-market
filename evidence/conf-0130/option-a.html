<!doctype html>
<html><head><style>
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#1f2937}
.wrap{max-width:960px;margin:0 auto;padding:32px}
h1{font-size:20px;margin:0 0 24px}
.card{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:20px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start}
.icon{width:40px;height:40px;border-radius:6px;background:#3b82f6;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.body{flex:1}
.body h2{margin:0 0 6px;font-size:15px}
.body p{margin:0;color:#4b5563}
.ttip{position:absolute;background:#111827;color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ttip::after{content:'';position:absolute;top:100%;left:18px;border:5px solid transparent;border-top-color:#111827}
.ttip.focused{left:12px;bottom:calc(100% + 8px)}
.ttip.hover{left:12px;bottom:calc(100% + 8px)}
.capt{position:fixed;left:16px;bottom:12px;background:#111827;color:#fff;font-size:12px;padding:6px 10px;border-radius:6px}
</style></head><body>
<div class="wrap">
<h1>Settings — Notification preferences</h1>
<div class="card" style="position:relative">
<div class="icon">N</div>
<div class="body">
<h2>Email notifications</h2>
<p>Receive weekly digests about your workspace activity.</p>
<div class="ttip focused">Email digest: every Monday 9am</div>
</div>
</div>
<div class="card" style="position:relative">
<div class="icon">S</div>
<div class="body">
<h2>Sound alerts</h2>
<p>Play a short chime when a task is assigned to you.</p>
<div class="ttip hover">Sound alerts: enabled, volume 60%</div>
</div>
</div>
</div>
<div class="capt">OPTION A — focus delay 0, hover delay 900ms</div>
</body></html>
