<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ec;color:#2c2c2c;height:800px;overflow:hidden}
#bar{position:absolute;left:16px;bottom:16px;background:#2c2c2c;color:#f4f1ec;padding:8px 14px;font-size:13px;border-radius:6px;letter-spacing:.3px}
.card{position:absolute;left:120px;top:120px;width:360px;background:#ffffff;border:1px solid #d9d2c7;border-radius:14px;padding:28px;box-shadow:0 12px 30px rgba(0,0,0,.08)}
h2{margin:0 0 8px;font-size:20px}
p{margin:0 0 20px;font-size:14px;line-height:1.5;color:#5a5a5a}
.swatch{display:flex;gap:12px;margin-bottom:22px}
.chip{width:56px;height:56px;border-radius:10px}
.chip1{background:#ffffff;border:2px solid #e07a5f}
.chip2{background:#ffffff;border:2px solid #3d405b}
.chip3{background:#ffffff;border:2px solid #81b29a}
.btn{display:inline-block;background:#ffffff;color:#3d405b;border:2px solid #3d405b;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600;transform:translateY(0);opacity:1}
.foot{position:absolute;left:120px;top:520px;font-size:13px;color:#5a5a5a}
.foot b{color:#2c2c2c}
</style></head><body>
<div id="bar">OPTION B — Only transform &amp; opacity</div>
<div class="card">
<h2>Save the palette</h2>
<p>Theme colours are set once; only position and fade move.</p>
<div class="swatch">
<div class="chip chip1"></div>
<div class="chip chip2"></div>
<div class="chip chip3"></div>
</div>
<span class="btn">Apply theme</span>
</div>
<div class="foot"><b>Colour animation skipped.</b> Rule B forbids animating colour, so the swatches and button keep their static fill and only move/fade.</div>
</body></html>
