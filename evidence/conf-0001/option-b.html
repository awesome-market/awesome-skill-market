<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Option B</title>
<style>
:root{--paper:#ffffff;--ink:hsl(0,0%,12%);--muted:hsl(0,0%,52%);--accent:hsl(0,0%,28%);--border:hsl(0,0%,88%)}
*{box-sizing:border-box;margin:0;padding:0}
body{height:800px;width:1200px;font-family:system-ui,Segoe UI,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:48px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:32px;border-bottom:1px solid var(--border)}
header h1{font-size:28px;font-weight:600;letter-spacing:.3px}
header nav span{margin-left:24px;color:var(--muted);font-size:14px}
main{display:grid;grid-template-columns:1fr 320px;gap:40px;margin-top:40px;flex:1}
.card{background:#ffffff;border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:20px;margin-bottom:12px}
.card p{color:var(--muted);line-height:1.6;font-size:15px;margin-bottom:24px}
button{background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:14px;cursor:pointer}
aside{display:flex;flex-direction:column;gap:24px}
.tile{background:#ffffff;border:1px solid var(--border);border-radius:10px;padding:24px}
.tile .label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.tile .value{font-size:22px;margin-top:8px}
.swatch{height:28px;border-radius:6px;margin-top:12px;background:linear-gradient(90deg,#ffffff,hsl(0,0%,28%))}
caption{position:fixed;left:0;bottom:0;background:#ffffff;color:var(--ink);padding:10px 20px;font-size:13px;letter-spacing:.5px;border-top:1px solid var(--border)}</style>
</head>
<body>
<header>
<h1>Atlas Dashboard</h1>
<nav><span>Overview</span><span>Reports</span><span>Settings</span></nav>
</header>
<main>
<section class="card">
<h2>Welcome back</h2>
<p>Your quarterly summary is ready. Review the flagged items below to keep the workspace aligned with the current design tokens.</p>
<button>Open summary</button>
</section>
<aside>
<div class="tile"><div class="label">Paper</div><div class="value">#ffffff</div><div class="swatch"></div></div>
<div class="tile"><div class="label">Accent</div><div class="value">hsl(0, 0%, 28%)</div></div>
<div class="tile"><div class="label">Muted text</div><div class="value">hsl(0, 0%, 52%)</div></div>
</aside>
</main>
<caption>OPTION B — pure white paper, zero-chroma neutrals</caption>
</body>
</html>
