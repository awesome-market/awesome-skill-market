<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#1a1a1a;height:800px;overflow:hidden}
.page{max-width:720px;margin:0 auto;padding:48px 40px 80px}
h1{font-size:28px;margin:0 0 12px}
p{font-size:15px;line-height:1.5;color:#444;margin:0 0 24px;max-width:520px}
.card{background:#fff;border:1px solid #d8dce3;border-radius:10px;padding:24px;margin-bottom:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 8px;font-size:17px}
.card p{margin:0 0 16px;font-size:14px}
.btn{display:inline-block;padding:10px 18px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.primary{background:#2f6fed;color:#fff}
.ghost{background:transparent;color:#2f6fed;border:1px solid #2f6fed}
.close{position:absolute;top:24px;right:24px;background:#fff;border:1px solid #d8dce3;border-radius:8px;padding:16px;width:260px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.close h3{margin:0 0 8px;font-size:15px}
.close p{margin:0 0 14px;font-size:13px;color:#444}
.close .row{display:flex;gap:8px}
.fab{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 28px;border-radius:8px;background:#2f6fed;color:#fff;font-weight:600;font-size:15px;border:none;cursor:pointer}
.caption{position:absolute;left:16px;bottom:12px;font-size:12px;color:#666;background:#fff;border:1px solid #d8dce3;padding:4px 10px;border-radius:5px}
</style></head><body>
<div class="page">
  <h1>Save your workspace</h1>
  <p>Choose a name and confirm. A single confirmation action keeps the page calm.</p>
  <div class="card">
    <h2>Workspace name</h2>
    <p>Enter a short label for this project so teammates can find it later.</p>
    <input style="width:100%;padding:9px 10px;border:1px solid #d8dce3;border-radius:6px;font-size:14px" value="Design system">
  </div>
  <button class="btn primary">Confirm workspace</button>
  <div class="close">
    <h3>Discard changes?</h3>
    <p>Unsaved edits will be lost.</p>
    <div class="row">
      <button class="btn primary">Keep edits</button>
      <button class="btn ghost">Discard</button>
    </div>
  </div>
  <button class="fab">+ New page</button>
</div>
<div class="caption">OPTION A — one page-level primary button</div>
</body></html>
