<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Attend Job — Rule B</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1a1a1a;height:800px;overflow:hidden}
.app{max-width:1200px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#fff;border-bottom:1px solid #e2e2e6}
.brand{font-weight:700;font-size:18px;letter-spacing:.3px}
nav{display:flex;gap:20px;font-size:14px;color:#555}
nav .active{color:#1a1a1a;font-weight:600;border-bottom:2px solid #1a1a1a;padding-bottom:4px}
.hero{flex:1;display:flex;align-items:center;padding:64px 48px;gap:48px}
.hero-copy{max-width:560px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#7a7a82;margin-bottom:12px}
.headline{font-size:52px;line-height:1.08;font-weight:800;margin-bottom:20px}
.headline .num{color:#2a6df5}
.sub{font-size:17px;color:#444;line-height:1.5;margin-bottom:28px}
.cta{display:inline-block;background:#1a1a1a;color:#fff;padding:14px 28px;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none}
.hero-visual{flex:1;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #e2e2e6;border-radius:16px;padding:32px;width:360px;box-shadow:0 12px 30px rgba(0,0,0,.06)}
.card h3{font-size:15px;color:#7a7a82;margin-bottom:16px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f3;font-size:15px}
.row:last-child{border-bottom:none}
.row b{font-weight:600}
.caption{position:absolute;left:24px;bottom:16px;background:#1a1a1a;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;letter-spacing:.3px}
</style></head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Lumen</div>
    <nav><span class="active">Events</span><span>My Tickets</span><span>Help</span></nav>
  </div>
  <div class="hero">
    <div class="hero-copy">
      <div class="eyebrow">Upcoming Attend Job</div>
      <h1 class="headline">1,240 <span style="font-size:28px;font-weight:700;color:#1a1a1a">seats left</span></h1>
      <p class="sub">This event is nearly sold out. Grab your ticket now before availability drops further.</p>
      <a class="cta" href="#">Get Tickets</a>
    </div>
    <div class="hero-visual">
      <div class="card">
        <h3>Ticket Details</h3>
        <div class="row"><span>Date</span><b>Sat, Aug 17</b></div>
        <div class="row"><span>Venue</span><b>Riverside Hall</b></div>
        <div class="row"><span>Seat</span><b>Row G, Seat 12</b></div>
        <div class="row"><span>Price</span><b>$48</b></div>
      </div>
    </div>
  </div>
</div>
<div class="caption">OPTION B — one hard fact on first screen</div>
</body></html>
