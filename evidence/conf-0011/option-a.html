<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f2ee;color:#222;height:800px;overflow:hidden}
.frame{position:absolute;inset:60px 80px 120px;border:1px solid #888;background:#fff}
.cap{position:absolute;left:80px;bottom:100px;max-width:320px;background:#fff;padding:8px 0}
.cap b{display:block;font-size:13px}
.cap small{display:block;font-size:11px;color:#555;margin-top:4px}
.foot{position:absolute;left:80px;right:80px;bottom:40px;font-size:12px;color:#333}
.foot .photographs{margin:0}
.foot .credits{margin:0}
</style></head><body>
<div class="frame"></div>
<div class="cap"><b>Evening train, platform 3</b><small>Factual caption lives outside the image frame, above the print.</small></div>
<div class="foot">
<p class="photographs">Photographs: © 2024 Metro Archive — CC BY 4.0</p>
<p class="credits">Design: Studio North; Layout: v2</p>
</div>
<div style="position:absolute;left:80px;bottom:16px;font-size:11px;color:#666">OPTION A — captions outside frame, credits in Photographs line</div>
</body></html>
