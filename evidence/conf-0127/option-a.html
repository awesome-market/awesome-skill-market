<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Option A</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8ec;height:800px;overflow:hidden}
#stage{display:flex;height:800px}
#left{width:480px;padding:64px;display:flex;flex-direction:column;justify-content:center}
h1{font-size:44px;line-height:1.1;margin-bottom:24px}
p{font-size:18px;line-height:1.6;color:#a8adb8;max-width:360px;margin-bottom:32px}
.chapters{display:flex;gap:12px}
.chap{height:64px;width:64px;border-radius:12px;background:#1c1f26;border:1px solid #2a2e37;display:flex;align-items:center;justify-content:center;font-size:14px;color:#8a90a0}
.chap.active{background:#3a6ea5;color:#fff;border-color:#3a6ea5}
#right{flex:1;background:#14161b;display:flex;align-items:center;justify-content:center;position:relative}
.card{width:320px;padding:32px;background:#1c1f26;border-radius:16px;border:1px solid #2a2e37}
.card h3{font-size:20px;margin-bottom:12px}
.card p{font-size:14px;color:#8a90a0}
.scroll-hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:13px;color:#5a6070;display:flex;align-items:center;gap:8px}
.scroll-hint .bar{width:120px;height:4px;background:#2a2e37;border-radius:2px}
caption{position:absolute;bottom:0;left:0;padding:12px 16px;background:#0a0c0f;color:#7a8090;font-size:12px;letter-spacing:.5px}
</style></head>
<body>
<div id="stage">
  <div id="left">
    <h1>Chapter One</h1>
    <p>Static entry. Nothing reveals itself as you move through the series.</p>
    <div class="chapters">
      <div class="chap active">1</div>
      <div class="chap">2</div>
      <div class="chap">3</div>
      <div class="chap">4</div>
    </div>
  </div>
  <div id="right">
    <div class="card">
      <h3>Series Overview</h3>
      <p>Four chapters. No horizontal reveal. No scroll choreography.</p>
    </div>
    <div class="scroll-hint"><span class="bar"></span>scroll available — nothing happens</div>
  </div>
</div>
<caption>OPTION A — no scroll reveal, no scrubbing</caption>
</body></html>
