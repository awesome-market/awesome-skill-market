<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f2ee;color:#222;height:800px;overflow:hidden}
.product{position:absolute;left:60px;top:60px;width:520px;height:480px;background:#ffffff;border:1px solid #d8d4cc;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.product::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#faf9f6 0 18px,#fff 18px 36px);border-radius:14px;pointer-events:none}
.label{position:absolute;left:60px;top:560px;font-size:13px;color:#6b6558;letter-spacing:.02em}
.body{position:absolute;left:60px;top:600px;font-size:13px;color:#6b6558}
.caption{position:absolute;left:0;bottom:0;padding:14px 20px;background:#2c2a26;color:#f4f2ee;font-size:13px;letter-spacing:.03em}
</style></head><body>
<div class="product"></div>
<div class="label">Canvas tote — 12oz natural cotton</div>
<div class="body">Wash cold. Tumble dry low. Reuse daily for groceries and books.</div>
<div class="caption">OPTION B — body text, not all caps</div>
</body></html>
