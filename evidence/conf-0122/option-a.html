<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#fff;color:#1a1a1a;height:800px;overflow:hidden}
.app{padding:48px;max-width:900px}
h1{font-size:28px;font-weight:700;margin:0 0 8px}
p.lead{font-size:15px;color:#555;margin:0 0 40px}
.section{margin-bottom:40px}
.section h2{font-size:18px;font-weight:600;margin:0 0 16px;border-bottom:1px solid #e0e0e0;padding-bottom:8px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.chip{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:#f0f0f0;color:#333}
.card{border:1px solid #e0e0e0;border-radius:8px;padding:20px;width:220px}
.card .label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.card .value{font-size:15px;color:#333}
.nav{display:flex;gap:24px;margin-bottom:32px}
.nav a{font-size:14px;color:#333;text-decoration:none;font-weight:600}
.tag{font-size:12px;background:#e8f0fe;color:#1a56db;padding:4px 10px;border-radius:4px}
.caption{font-size:13px;color:#777;margin-top:8px}
.bar{position:fixed;left:0;bottom:0;background:#1a1a1a;color:#fff;padding:10px 16px;font-size:13px;font-weight:600;letter-spacing:0.02em}
</style></head><body>
<div class="app">
 <h1>Order summary</h1>
 <p class="lead">Review the items in your cart before checkout.</p>
 <nav class="nav">
 <a href="#">Shipping</a>
 <a href="#">Payment</a>
 <a href="#">Review</a>
 </nav>
 <div class="section">
 <h2>Items</h2>
 <div class="row">
 <div class="card">
 <span class="label">SUBTOTAL</span>
 <span class="value">$42.00</span>
 <div class="caption">Tax included at checkout</div>
 </div>
 <div class="card">
 <span class="label">SHIPPING</span>
 <span class="value">$5.00</span>
 <div class="caption">Standard delivery</div>
 </div>
 <div class="card">
 <span class="label">TOTAL</span>
 <span class="value">$47.00</span>
 <div class="caption">Payable now</div>
 </div>
 </div>
 </div>
 <div class="section">
 <h2>Tags</h2>
 <div class="row">
 <span class="tag">ELECTRONICS</span>
 <span class="tag">IN STOCK</span>
 <span class="tag">SHIPS TODAY</span>
 </div>
 </div>
</div>
<div class="bar">OPTION A — lowercase labels everywhere</div>
</body></html>
