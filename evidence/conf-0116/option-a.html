<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f4f5;color:#18181b}
.mock{width:1200px;height:800px;background:#fff;border:1px solid #d4d4d8;position:relative;overflow:hidden}
.topbar{height:56px;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;padding:0 24px;font-weight:600}
.layout{display:grid;grid-template-columns:240px 1fr 280px;height:calc(800px - 56px)}
aside{border-right:1px solid #e4e4e7;padding:20px}
.card{background:#fafafa;border:1px solid #e4e4e7;border-radius:8px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 8px;font-size:14px}
.card p{margin:0;font-size:12px;color:#52525b}
.main{padding:24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:16px}
.box{flex:1;background:#fafafa;border:1px solid #e4e4e7;border-radius:8px;height:120px}
.right{border-left:1px solid #e4e4e7;padding:20px}
.tag{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:4px;padding:2px 8px;font-size:11px;margin-bottom:8px}
caption{position:absolute;left:12px;bottom:12px;background:#18181b;color:#fff;padding:6px 10px;border-radius:4px;font-size:12px;letter-spacing:.3px}
</style></head><body>
<div class="mock">
  <div class="topbar">Acme Dashboard</div>
  <div class="layout">
    <aside>
      <div class="card"><h3>Settings</h3><p>Spacing uses 4px unit directly</p></div>
      <div class="card"><h3>Profile</h3><p>No --spacing tokens emitted</p></div>
    </aside>
    <div class="main">
      <span class="tag">no-spacing-tokens: ON</span>
      <div class="row"><div class="box"></div><div class="box"></div></div>
      <div class="card"><h3>Activity</h3><p>g-4 p-4 w-8 derived from 4px unit</p></div>
    </div>
    <div class="right">
      <span class="tag">space-scale-to-tailwind-unit: 4px</span>
      <div class="card"><h3>Scale</h3><p>0→0 4→4px 8→8px 16→16px</p></div>
    </div>
  </div>
  <div class="caption">OPTION A — no --spacing tokens emitted</div>
</div>
</body></html>
