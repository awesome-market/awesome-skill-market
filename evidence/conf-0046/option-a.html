<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Option A</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#fff;color:#1a1a1a;height:800px;overflow:hidden}
.hero{display:flex;flex-direction:column;justify-content:center;padding:80px 120px;max-width:1100px;height:100%}
.kicker{font-size:13px;letter-spacing:1px;color:#6b7280;text-transform:uppercase;margin-bottom:16px}
h1{font-size:56px;line-height:1.1;margin:0 0 24px;font-weight:700}
.quote{font-size:24px;line-height:1.5;color:#374151;margin:0 0 32px;max-width:700px;font-style:italic}
.attribution{display:flex;align-items:center;gap:16px}
.avatar{width:56px;height:56px;border-radius:50%;background:#d1d5db}
.name{font-weight:600;font-size:16px;margin:0}
.role{color:#6b7280;font-size:14px;margin:2px 0 0}
.caption{position:absolute;left:24px;bottom:24px;font-size:13px;color:#6b7280;border-left:3px solid #3b82f6;padding-left:10px}
</style></head>
<body>
<div class="hero">
  <p class="kicker">Productivity · Team Plans</p>
  <h1>Ship faster with fewer handoffs.</h1>
  <p class="quote">&ldquo;We cut our release cycle by two weeks and stopped missing deadlines.&rdquo;</p>
  <div class="attribution">
    <div class="avatar" aria-hidden="true"></div>
    <div>
      <p class="name">— Name omitted</p>
      <p class="role">— Role omitted</p>
    </div>
  </div>
</div>
<div class="caption">OPTION A — quote shown, attribution left empty</div>
</body></html>
