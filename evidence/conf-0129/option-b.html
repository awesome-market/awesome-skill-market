<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui;background:#1a1a1f;color:#eee;height:800px;overflow:hidden}
#stage{display:flex;flex-direction:column;height:100%}
header{padding:24px 32px;border-bottom:1px solid #333;display:flex;align-items:center;gap:16px}
h1{font-size:20px;margin:0}
.badge{background:#555;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px}
main{flex:1;padding:32px;display:flex;gap:24px;overflow:auto}
card{background:#25252d;border:1px solid #333;border-radius:12px;padding:20px;width:280px}
card h2{margin:0 0 8px;font-size:16px}
p{margin:0 0 16px;font-size:13px;color:#aaa}
.paused{display:flex;align-items:center;gap:10px;opacity:.6}
.orb{width:14px;height:14px;border-radius:50%;background:#666}
.playbtn{background:#4af;color:#111;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
footer{position:absolute;bottom:0;left:0;background:#111;padding:10px 20px;font-size:13px;border-top:1px solid #333}
</style></head><body>
<div id="stage">
<header><h1>SoundScape</h1><span class="badge">Audio paused</span></header>
<main>
<div style="background:#25252d;border:1px solid #333;border-radius:12px;padding:20px;width:280px">
<h2>Guided Breathing</h2>
<p>Voice waits until the user taps play.</p>
<div class="paused"><div class="orb"></div><span style="font-size:12px;color:#888">Not playing</span></div>
<button class="playbtn">Play</button>
</div>
<div style="background:#25252d;border:1px solid #333;border-radius:12px;padding:20px;width:280px">
<h2>Daily Affirmation</h2>
<p>Auto-started voice loop, no tap required.</p>
<div class="paused"><div class="orb"></div><span style="font-size:12px;color:#888">Not playing</span></div>
<button class="playbtn">Play</button>
</div>
</main>
</div>
<footer>OPTION B — No audio without user interaction</footer>
</body></html>
