<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui;background:#1a1a1f;color:#eee;height:800px;overflow:hidden}
#stage{display:flex;flex-direction:column;height:100%}
header{padding:24px 32px;border-bottom:1px solid #333;display:flex;align-items:center;gap:16px}
h1{font-size:20px;margin:0}
.badge{background:#2a6;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px}
main{flex:1;padding:32px;display:flex;gap:24px;overflow:auto}
card{background:#25252d;border:1px solid #333;border-radius:12px;padding:20px;width:280px}
card h2{margin:0 0 8px;font-size:16px}
p{margin:0 0 16px;font-size:13px;color:#aaa}
.playing{display:flex;align-items:center;gap:10px}
.orb{width:14px;height:14px;border-radius:50%;background:#4af;box-shadow:0 0 12px #4af;animation:none}
.wave{display:flex;gap:3px;align-items:flex-end;height:24px}
.wave i{width:4px;background:#4af;height:100%}
footer{position:absolute;bottom:0;left:0;background:#111;padding:10px 20px;font-size:13px;border-top:1px solid #333}
</style></head><body>
<div id="stage">
<header><h1>SoundScape</h1><span class="badge">Loop active</span></header>
<main>
<div style="background:#25252d;border:1px solid #333;border-radius:12px;padding:20px;width:280px">
<h2>Guided Breathing</h2>
<p>Voice narration plays continuously as the group loop.</p>
<div class="playing"><div class="orb"></div><div class="wave"><i style="height:60%"></i><i style="height:100%"></i><i style="height:40%"></i><i style="height:80%"></i></div><span style="font-size:12px;color:#4af">Playing now</span></div>
</div>
<div style="background:#25252d;border:1px solid #333;border-radius:12px;padding:20px;width:280px">
<h2>Daily Affirmation</h2>
<p>Auto-started voice loop, no tap required.</p>
<div class="playing"><div class="orb"></div><div class="wave"><i style="height:80%"></i><i style="height:40%"></i><i style="height:100%"></i><i style="height:60%"></i></div><span style="font-size:12px;color:#4af">Playing now</span></div>
</div>
</main>
</div>
<footer>OPTION A — Voice always runs as group loop</footer>
</body></html>
