<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f2ee;color:#1a1a1a;height:800px;overflow:hidden}
header{padding:24px 32px;border-bottom:1px solid #d8d4cc;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0;letter-spacing:-0.3px}
.tag{font-size:11px;background:#1a1a1a;color:#fff;padding:4px 8px;border-radius:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:32px;height:640px}
.card{background:#fff;border:1px solid #d8d4cc;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;margin:0}
.promised{font-size:12px;color:#555;margin:0}
.imgbox{flex:1;border-radius:6px;overflow:hidden;background:#e8e5de;position:relative;padding:16px}
.axis{position:absolute;left:40px;right:16px;bottom:40px;top:16px;border-left:1px solid #bbb;border-bottom:1px solid #bbb}
.bar{position:absolute;bottom:0;width:24px;background:#3a7bd5;border-radius:3px 3px 0 0}
.bar2{background:#2a9d8f}
.label{position:absolute;font-size:10px;color:#333}
.no{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:11px}
footer{position:absolute;bottom:0;left:0;padding:8px 16px;background:#1a1a1a;color:#fff;font-size:11px;border-top-right-radius:6px}
</style></head><body>
<header><h1>Acme Smart Thermostat</h1><span class="tag">OPTION B</span></header>
<div class="grid">
<div class="card">
<h2>Heats your room in 10 minutes</h2>
<p class="promised">Promise shown via data visualization</p>
<div class="imgbox"><div class="axis">
<div class="bar" style="left:20px;height:60%"><span class="label" style="bottom:22px;left:12px">10 min</span></div>
<div class="bar bar2" style="left:56px;height:90%"><span class="label" style="bottom:22px;left:12px">32 min</span></div>
</div></div>
</div>
<div class="card">
<h2>Saves 20% on energy bills</h2>
<p class="promised">Promise shown via data visualization</p>
<div class="imgbox"><div class="axis">
<div class="bar" style="left:20px;height:80%"><span class="label" style="bottom:22px;left:12px">-20%</span></div>
<div class="bar bar2" style="left:56px;height:95%"><span class="label" style="bottom:22px;left:12px">-5%</span></div>
</div></div>
</div>
</div>
<footer>OPTION B — charts instead of product photos</footer>
</body></html>
