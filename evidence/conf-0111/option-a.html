<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f2ee;color:#1a1a1a;height:800px;overflow:hidden}
header{padding:24px 32px;border-bottom:1px solid #d8d4cc;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0;letter-spacing:-0.3px}
.tag{font-size:11px;background:#1a1a1a;color:#fff;padding:4px 8px;border-radius:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:32px;height:640px}
.card{background:#fff;border:1px solid #d8d4cc;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;margin:0}
.promised{font-size:12px;color:#555;margin:0}
.imgbox{flex:1;border-radius:6px;overflow:hidden;position:relative;background:#e8e5de}
.product{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dot{width:60px;height:60px;border-radius:50%;background:#3a7bd5}
.caption{position:absolute;bottom:8px;left:8px;font-size:10px;color:#333;background:rgba(255,255,255,0.85);padding:2px 6px;border-radius:3px}
.bar{height:8px;background:#3a7bd5;border-radius:4px;margin-top:4px}
footer{position:absolute;bottom:0;left:0;padding:8px 16px;background:#1a1a1a;color:#fff;font-size:11px;border-top-right-radius:6px}
</style></head><body>
<header><h1>Acme Smart Thermostat</h1><span class="tag">OPTION A</span></header>
<div class="grid">
<div class="card">
<h2>Heats your room in 10 minutes</h2>
<p class="promised">Promise: fast heating shown as a picture</p>
<div class="imgbox"><div class="product"><div class="dot"></div></div><span class="caption">Product photo of thermostat</span></div>
</div>
<div class="card">
<h2>Saves 20% on energy bills</h2>
<p class="promised">Promise: savings shown as a picture</p>
<div class="imgbox"><div class="product"><div class="dot" style="background:#2a9d8f"></div></div><span class="caption">Product photo of thermostat</span></div>
</div>
</div>
<footer>OPTION A — every promise shown in a picture</footer>
</body></html>
