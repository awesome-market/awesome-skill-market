<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Option B</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f4f5f7;color:#1a1a1a;height:800px;display:flex;flex-direction:column}
.main{flex:1;padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:720px;margin:0 auto}
h1{font-size:32px;margin-bottom:16px}
p{font-size:16px;line-height:1.6;color:#444;margin-bottom:24px}
.footer{background:#ffffff;border-top:1px solid #e0e0e0;padding:28px 48px;display:flex;flex-direction:column;gap:16px}
.footer .close-row{display:flex;align-items:center;justify-content:space-between;gap:24px}
.footer .statement{font-size:14px;color:#555;max-width:60%}
.footer .actions{display:flex;gap:12px;align-items:center}
.btn{padding:12px 22px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:none}
.btn.primary{background:#2563eb;color:#fff}
.btn.ghost{background:transparent;color:#2563eb;border:1px solid #2563eb}
.caption{position:fixed;left:0;bottom:0;background:#1a1a1a;color:#fff;padding:10px 16px;font-size:13px;letter-spacing:.3px}
</style></head>
<body>
<div class="main">
<h1>Your workspace is ready</h1>
<p>Settings synced and invite sent. Review the summary below before you begin.</p>
</div>
<footer class="footer">
<div class="close-row">
<div class="statement">By continuing, you accept the updated terms and acknowledge the data summary.</div>
<div class="actions">
<button class="btn primary">Finish</button>
</div>
</div>
<div class="directory-row" style="font-size:13px;color:#777">Directory: workspace / team / settings</div>
</footer>
<div class="caption">OPTION B — close row carries one primary button</div>
</body></html>
