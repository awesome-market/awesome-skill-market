<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f2ee;color:#222}
#stage{width:1200px;height:800px;background:#fff;border:1px solid #ccc;box-sizing:border-box;padding:40px;display:flex;flex-direction:column}
h1{font-size:28px;margin:0 0 8px}
p.lead{margin:0 0 24px;color:#555;max-width:640px}
.footers{display:flex;gap:40px;flex:1}
.footer{width:560px;background:#2b2b2b;color:#e8e8e8;padding:28px 32px;border-radius:6px}
.footer h2{margin:0 0 16px;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#9a9a9a}
.credit-line{display:block;font-size:13px;line-height:1.6;margin:0 0 6px;color:#dcdcdc}
.credit-line small{color:#888}
.caption{position:fixed;left:16px;bottom:16px;background:#2b2b2b;color:#fff;padding:8px 14px;font-size:13px;border-radius:4px}
</style></head><body>
<div id="stage">
  <h1>Acme Field Guide — Footer</h1>
  <p class="lead">A short product page footer showing a single combined credit line.</p>
  <div class="footers">
    <div class="footer" data-credits="">
      <h2>Image credits</h2>
      <span class="credit-line">Harbor Bridge (1974), Mountain Range (2018), City Grid (2021) — Acme Archive; Interior Mockup — Acme Studios</span>
    </div>
  </div>
</div>
<div class="caption">OPTION B — one combined credit line, no render credit</div>
</body></html>
