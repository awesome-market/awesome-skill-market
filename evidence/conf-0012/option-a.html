<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Option A</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ec;color:#1a1a1a}
.hero{min-height:800px;display:flex;flex-direction:column;justify-content:center;padding:80px 120px;max-width:1200px}
h1{font-size:56px;line-height:1.1;margin:0 0 24px;font-weight:700;color:#0f3d2e}
.lead{font-size:22px;line-height:1.5;max-width:640px;margin:0 0 40px;color:#333}
.actions{display:flex;gap:16px}
.btn{padding:14px 28px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;border:none}
.primary{background:#0f3d2e;color:#fff}
.secondary{background:transparent;color:#0f3d2e;border:2px solid #0f3d2e}
.caption{position:fixed;left:0;bottom:0;background:#0f3d2e;color:#fff;padding:10px 20px;font-size:13px;letter-spacing:.5px}

<body>
<section class="hero">
<h1>Design faster with fewer decisions</h1>
<p class="lead">Our toolkit removes friction so your team ships clean interfaces without endless debates.</p>
<div class="actions">
<button class="btn primary">Start free trial</button>
<button class="btn secondary">Watch demo</button>
</div>
</section>
<div class="caption">OPTION A — hero text ≤7 words, two actions</div>
</body></html>
