<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Option B</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#f4efe6;color:#2b2b2b;height:800px;overflow:hidden}
.hero{height:600px;display:flex;flex-direction:column;justify-content:center;padding:60px;background:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),radial-gradient(circle at 70% 50%,#8fa67a,#4a613a);color:#2b2b2b}
.eyebrow{font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
h1{font-size:48px;line-height:1.15;margin:14px 0 20px;max-width:600px}
.open-now{display:inline-flex;align-items:center;gap:10px;background:#2b2b2b;color:#f4efe6;padding:12px 22px;font-size:16px;border-radius:4px;margin-top:8px}
.dot{width:10px;height:10px;background:#6fcf7a;border-radius:50%}
.hours{margin-top:22px;font-size:16px;line-height:1.7;max-width:480px}
.furniture{margin-top:26px;font-size:15px;opacity:.85}
.caption{position:absolute;bottom:0;left:0;padding:14px 20px;background:#2b2b2b;color:#f4efe6;font-size:13px;letter-spacing:1px}
</style></head>
<body>
<section class="hero">
 <p class="eyebrow">Open now</p>
 <h1>Two chairs by the window, kettle on, rain at the glass.</h1>
 <p class="open-now"><span class="dot"></span>Open now — until 11:00pm</p>
 <p class="hours">Mon–Thu 4:00–10:00 · Fri–Sun 4:00–11:00</p>
 <p class="furniture">Cast-iron stove, corner table, two stools at the counter.</p>
</section>
<div class="caption">OPTION B — open-now line shown when hours given</div>
</body></html>
