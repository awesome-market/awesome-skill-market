<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ec;color:#222;height:800px;overflow:hidden}
#stage{display:flex;flex-direction:column;height:100%}
header{height:60px;border-bottom:1px solid #d8d2c8;padding:0 32px;display:flex;align-items:center;gap:12px}
header .logo{width:28px;height:28px;background:#3a3a3a;border-radius:6px}
header h1{font-size:15px;font-weight:600;margin:0}
main{flex:1;display:flex;gap:0}
.band{flex:1;padding:32px;display:flex;flex-direction:column;gap:16px}
.band h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#6b6458;margin:0}
.photo{height:220px;background:#7a9e7a;border-radius:8px;position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent)}
.photo .cap{position:absolute;bottom:12px;left:12px;color:#fff;font-size:12px;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:4px}
.render{height:220px;background:#c9a26b;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}
.render .vase{width:70px;height:110px;background:#3a3a3a;border-radius:35px 35px 8px 8px;position:relative}
.render .vase::before{content:"";position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:20px;height:24px;background:#3a3a3a;border-radius:4px}
.render .label{position:absolute;bottom:12px;right:12px;color:#fff;font-size:12px;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:4px}
footer{height:28px;background:#3a3a3a;color:#f4f1ec;font-size:11px;padding:0 32px;display:flex;align-items:center}
#caption{position:absolute;bottom:0;left:0;background:#3a3a3a;color:#f4f1ec;font-size:12px;padding:8px 14px;border-radius:0 8px 0 0;z-index:5}
</style></head><body>
<div id="stage">
<header><div class="logo"></div><h1>Atelier — Living</h1></header>
<main>
<section class="band">
<h2>Photography band</h2>
<div class="photo"><span class="cap">Linen sofa · $890</span></div>
<div class="photo" style="background:#8a7ec9"><span class="cap">Ceramic bowl · $45</span></div>
</section>
<section class="band">
<h2>Product render</h2>
<div class="render"><div class="vase"></div><span class="label">Chair · $1,200</span></div>
</section>
</main>
<footer>One band of photographs + one product render — allowed by Rule A</footer>
</div>
<div id="caption">OPTION A — one photo band plus one render</div>
</body></html>
