<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ec;color:#2c2c2c;height:800px;overflow:hidden}
header{padding:24px 32px;border-bottom:1px solid #d8d2c6}
h1{margin:0;font-size:22px;letter-spacing:.3px}
p.sub{margin:6px 0 0;font-size:13px;color:#6b6458}
.card{position:absolute;top:120px;left:32px;width:340px;background:#fff;border:1px solid #d8d2c6;border-radius:10px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.card h2{margin:0 0 8px;font-size:16px}
.card p{margin:0 0 16px;font-size:13px;color:#6b6458}
.swatch{width:100%;height:64px;border-radius:6px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 18px;border-radius:6px;border:none;background:#3a3a3a;color:#fff;font-size:13px;cursor:pointer}
/* Rule A: only transform + opacity listed */
.swatch{transition:transform .25s ease, opacity .25s ease;background:#7a9e7a}
.swatch:hover{transform:translateY(-4px) scale(1.02);opacity:.85}
.btn{transition:transform .2s ease, opacity .2s ease;background:#3a3a3a}
.btn:hover{transform:translateY(-2px);opacity:.8}
.meta{position:absolute;bottom:20px;left:32px;font-size:12px;color:#6b6458}
caption{position:fixed;bottom:0;left:0;padding:10px 16px;background:#2c2c2c;color:#f4f1ec;font-size:12px;letter-spacing:.3px}
</style></head><body>
<header><h1>TaskBoard</h1><p class="sub">Card surface with colour swatch and action button</p></header>
<div class="card">
  <h2>Design review</h2>
  <p>Hover the swatch and button to inspect the transition rule.</p>
  <div class="swatch"></div>
  <button class="btn">Open panel</button>
</div>
<div class="meta">Hover state shown statically — swatch lifted and dimmed; button lifted and dimmed.</div>
<caption>OPTION A — only transform and opacity animated</caption>
</body></html>
