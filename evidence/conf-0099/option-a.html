<!doctype html>
<html><head><style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1020;color:#e6ecff;height:800px;overflow:hidden}
#stage{position:absolute;inset:0}
#hero{position:absolute;left:80px;top:120px;max-width:520px;z-index:5}
h1{font-size:44px;line-height:1.1;margin:0 0 12px;letter-spacing:-.5px}
p{font-size:15px;line-height:1.6;color:#9fb0d8;margin:0 0 24px}
button{background:#3a6df5;color:#fff;border:0;padding:12px 22px;border-radius:8px;font-size:14px;cursor:pointer}
#card{position:absolute;right:80px;top:160px;width:320px;background:#141c33;border:1px solid #23305a;border-radius:12px;padding:22px;z-index:6;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#card h3{margin:0 0 8px;font-size:16px}
#card p{margin:0;font-size:13px;color:#9fb0d8}
#caption{position:absolute;left:16px;bottom:16px;background:#0b1020;border:1px solid #23305a;color:#9fb0d8;padding:6px 12px;border-radius:6px;font-size:12px;z-index:10}
</style></head><body>
<div id="stage">
  <div id="hero">
    <h1>Quiet depth, no glow behind content.</h1>
    <p>Depth here comes from lightness steps and offset-blurred shadows, never a radial spotlight behind the hero.</p>
    <button>Get started</button>
  </div>
  <div id="card">
    <h3>Feature summary</h3>
    <p>Subtle elevation via layered shadows keeps the hero clear of any atmospheric bloom.</p>
  </div>
</div>
<div id="caption">OPTION A — no radial spotlight behind hero</div>
</body></html>
