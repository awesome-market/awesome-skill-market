<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200,height=800">
<title>Option A</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,sans-serif;background:#ffffff;color:#1a1a1a;min-height:800px}
.wrap{max-width:760px;margin:0 auto;padding:40px 48px}
header{display:flex;align-items:center;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid #e2e2e2;margin-bottom:32px}
h1{font-size:20px;font-weight:600}
.badge{font-size:11px;background:#e8f4ec;color:#1b7a3d;padding:4px 10px;border-radius:999px}
.card{background:#ffffff;border:1px solid #dcdcdc;border-radius:10px;padding:24px;margin-bottom:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid #b0b0b0;border-radius:6px;background:#ffffff;color:#1a1a1a;font:inherit}
input[type=text]:focus{outline:2px solid #2b6cb0;border-color:#2b6cb0}
select{width:100%;padding:10px 12px;border:1px solid #b0b0b0;border-radius:6px;background:#ffffff;color:#1a1a1a;font:inherit}
.row{display:flex;gap:16px;margin-bottom:20px}
.row>div{flex:1}
.note{font-size:12px;color:#666;margin-top:8px}
footer{margin-top:8px;font-size:11px;color:#888}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Settings</h1>
<span class="badge">color-scheme: light dark</span>
</header>
<div class="card">
<label for="name">Display name</label>
<input id="name" type="text" value="Casey Morgan">
<p class="note">Input background follows light mode even when the page is dark.</p>
</div>
<div class="card">
<label for="theme">Theme</label>
<select id="theme">
<option>System</option>
<option>Light</option>
<option>Dark</option>
</select>
</div>
<div class="card">
<label for="bio">Bio</label>
<input id="bio" type="text" value="Designer &amp; researcher">
</div>
<footer>Form controls inherit the light side of the dual color-scheme.</footer>
</div>
</body>
</html>
