name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: unit tests
        run: npm test
      - name: schema validate
        run: node pipeline/validate.js
      - name: build reproducibility
        run: node pipeline/build.js --check
