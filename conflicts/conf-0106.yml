ai_explanation: a11y-l0c2-always-visible-focus-ring requires every interactive element to have an instantly visible :focus-visible ring and never remove an outline without replacing it with an equivalent visible focus indicator, while a11y-l0c1-focus-visible-rings shows visible focus rings via focus-visible selectors rather than focus to avoid rings on click. The first treats focus-visible as always showing a ring; the second explicitly avoids rings on click via focus-visible semantics. In the same scope of focus-ring behavior these contradict and no scope-split resolves them.
ai_explanation_zh: a11y-l0c2-always-visible-focus-ring 要求每个交互元素都必须有即时可见的 :focus-visible 环，且不得在未用等效可见焦点指示器替换的情况下移除 outline；a11y-l0c1-focus-visible-rings 则通过 focus-visible 选择器（而非 focus）显示可见焦点环，从而避免点击时出现环。前者把 focus-visible 视为始终显示环，后者则显式通过 focus-visible 语义避免点击时出现环。在焦点环行为的同一范围内二者相互矛盾，且任何作用域拆分都无法解决。
