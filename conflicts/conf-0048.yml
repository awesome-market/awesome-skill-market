ai_explanation: These two rules both govern hero/scene selection but use contradictory selection logic in the same scope. l2c1-timing mandates deterministic history-based hero selection (first printed result unless it clashes with logo/photographs, never violet), while l2c1-deal-scenes-by-fit-and-need mandates randomized selection among scenes whose fits/types/needs match, weighted by weight and avoiding the last three history entries. When the first deterministic history result happens to be among the last three history entries or has low weight, the two rules directly contradict with no scope-split that resolves them.
ai_explanation_zh: 这两条规则都用于控制 hero/场景选择，但在同一范围内使用了相互矛盾的选取逻辑。l2c1-timing 要求确定性的基于历史记录的 hero 选取（优先取首个打印结果，除非与 logo/照片冲突，且绝不使用 violet）；l2c1-deal-scenes-by-fit-and-need 则要求在 fits/types/needs 均匹配的场景中按 weight 加权随机选取，并避开 scenes-history.json 中的最近三条记录。当首个确定性历史结果恰好落在最近三条记录内或权重较低时，两条规则直接冲突，且没有作用域划分能解决该冲突。
