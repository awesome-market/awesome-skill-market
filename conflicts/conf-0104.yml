ai_explanation_zh: 规则A要求移除任何移除后会丧失清晰度、引导或状态确认的动画（始终保留功能性动效），这与规则B“不要在页面加载或滚动时通过淡入、上升、交错、遮罩擦除或滚动驱动动效揭示内容”直接冲突。在加载时进行的功能性揭示（例如数字跳动以确认已提供的数值，或状态确认揭示）既是状态必需动效，又属于加载/滚动揭示，因此保留它会违反禁令，而执行禁令则会移除关键动效。由于两条规则都管辖同一加载时揭示事件，无法通过作用域拆分解决。
