ai_explanation: "Rule imagery-l1c1-scene-props-and-frames requires showing product/service/place frames on flat colour with photographs and using a single border radius 12-20px for software window photographs, while imagery-l1c2-visual-robustness-and-places requires place photographs with square corners and no border/shadow/overlay/frame. These directly contradict for place/room imagery: one mandates rounded frames and flat-colour grounds, the other mandates square corners with no frame."
ai_explanation_zh: 规则 imagery-l1c1-scene-props-and-frames 要求在纯色背景上展示产品/服务/场所框架，并对软件窗口照片使用单一 12-20px 圆角；而 imagery-l1c2-visual-robustness-and-places 要求场所照片采用 square corners（直角）且无边框/阴影/覆盖层/框架。两者在场所/房间图像上直接冲突：一个要求圆角框架与纯色背景，另一个要求直角且无框架。
suggestion:
  kind: scope-split
  note: Apply rounded frames to software windows and flat-colour grounds to product/service frames; apply square corners with no frame to place/room photographs.
  note_zh: 对软件窗口应用圆角框架，对产品/服务框架应用纯色背景；对场所/房间照片应用直角且无框架。
