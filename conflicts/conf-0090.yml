ai_explanation: hallma-580 mandates a visible label above every field and forbids placeholder-as-label, while fronte-010 forbids adding typographic labels above content unless they carry meaning. For fields where the label is purely functional (e.g., a search box, a toggle, or a field whose purpose is obvious from context), hallma-580 forces a label that fronte-010 deems meaningless — a direct 'always label' vs 'never label' contradiction in the same scope.
ai_explanation_zh: hallma-580 要求每个字段上方必须有可见标签，禁止用占位符代替标签；而 fronte-010 禁止在内容上方添加无意义的排版标签。对于标签仅具功能性（如搜索框、切换开关或用途显然的字段）的场景，hallma-580 强制添加的标签正是 fronte-010 认为无意义的——这是同一作用域内'始终加标签'与'永不加标签'的直接矛盾。
suggestion:
