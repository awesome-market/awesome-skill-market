  note: "Resolve by treating 'meaningful' as including functional clarity: a label counts as meaningful when its absence would leave the field's purpose ambiguous; otherwise use inline/placeholder patterns permitted by fronte-010."
  note_zh: 将'有意义'扩展为包含功能性清晰度：当字段目的不明确时，标签即有意义；否则可使用 fronte-010 允许的内联/占位符模式。
