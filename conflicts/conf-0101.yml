ai_explanation: The no-cream rule forbids defaulting to a warm cream background with high-contrast serif display + terracotta accents, while soft-focal-grounds explicitly permits painterly-landscape/silk-folds grounds behind fragments — which are the canonical vehicle for warm cream + terracotta looks. A reasonable scope-split (cream only for explicitly requested 'warm/terracotta/serif' briefs) resolves them, so this is NOT a true dilemma.
ai_explanation_zh: 「无奶油色」规则禁止默认使用暖奶油色背景搭配高对比衬线展示字体与赤陶色/暖陶土强调色；而「柔和焦点背景」明确允许在碎片下方使用绘画式风景、丝绸褶皱等柔和背景——这些正是实现暖奶油色+赤陶效果的典型载体。通过按明确需求范围划分（仅对明确要求「暖色/赤陶/衬线」的简报使用奶油色）即可调和，因此并非真正的两难。
