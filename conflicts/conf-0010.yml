ai_explanation_zh: 规则 l0c1-focus-ring-specs 要求使用 2px 动作色聚焦环，通过 outline-offset（距控件 2px）实现且无过渡；l0c2-focus-visible-and-no-hidden-outlines 要求通过 outline 实现即时可见的 :focus-visible 指示器，并禁止 outline:none，除非以等效的可见聚焦样式替换。两者在聚焦环机制上直接冲突：l0c1 指定了基于 offset 的特定环，而 l0c2 要求基于 outline 的指示器，并隐含禁止依赖非 outline 的聚焦样式。由于两者均作用于同一 focus-visible 渲染范围，无法通过作用域拆分解决。
