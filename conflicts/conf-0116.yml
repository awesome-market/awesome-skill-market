    text: Map the space scale directly onto Tailwind's 4px unit without a --spacing- namespace.
    text_zh: 将间距比例直接映射到 Tailwind 的 4px 单位，不使用 --spacing- 命名空间。
ai_explanation: "'no-spacing-tokens' never emits --spacing-<name>, yet 'space-scale-to-tailwind-unit' maps the space scale onto Tailwind's 4px unit — which, if implemented via --spacing- tokens, would violate the first rule. These contradict when the space scale is expressed through the --spacing- namespace."
ai_explanation_zh: "'no-spacing-tokens' 从不生成 --spacing-<name> 令牌，而 'space-scale-to-tailwind-unit' 将间距比例直接映射到 Tailwind 的 4px 单位——若通过 --spacing- 令牌实现，则违反第一条规则。当间距比例通过 --spacing- 命名空间表达时，二者相互矛盾。"
suggestion:
