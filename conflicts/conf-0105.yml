ai_explanation: "a11y-l0c1-instant-focus-rings mandates rendering focus rings instantly with no fade-in/transition and keeping them 2px off the control via an action color, while a11y-l0c1-focus-visible-rings requires showing focus rings only through focus-visible selectors rather than focus to avoid rings on click. These directly contradict in scope: one always renders an instant visible ring (implying it shows on all focus including click), the other never shows rings on click and only via focus-visible. No scope-split resolves this because both govern the same focus-ring rendering decision."
ai_explanation_zh: a11y-l0c1-instant-focus-rings 要求焦点环即时渲染、无淡入/过渡，并通过 action 颜色使其与控件保持 2px 间距；a11y-l0c1-focus-visible-rings 则要求仅通过 focus-visible 选择器显示焦点环而非 focus，以避免点击时出现焦点环。二者在作用域上直接冲突：一个始终渲染即时可见的焦点环（隐含点击时也显示），另一个则点击时不显示、仅通过 focus-visible 显示。由于二者都管辖同一焦点环渲染决策，无法通过作用域拆分解决。
suggestion:
  kind: keep-b
  note: Prefer focus-visible semantics to avoid rings on click; keep instant rendering once visible.
  note_zh: 优先采用 focus-visible 语义以避免点击时出现焦点环；一旦显示则保持即时渲染。
