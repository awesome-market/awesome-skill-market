ai_explanation: motion-l0c1 forbids animating layout properties (width, height, top, left, margin, padding) and requires moving tab indicators by transform alone with fixed-height panels, but motion-l0c4 explicitly animates grid-template-rows from 0fr to 1fr to expand FAQ answers over --dur-long, which is a layout property animation.
ai_explanation_zh: motion-l0c1 禁止动画化布局属性（width、height、top、left、margin、padding），并要求仅通过 transform 移动 tab 指示器、使用固定高度面板；但 motion-l0c4 明确将 grid-template-rows 从 0fr 动画到 1fr，以 --dur-long 展开 FAQ 答案，这属于布局属性动画。
suggestion:
  kind: scope-split
  note: FAQ/disclosable expansion is a distinct interaction context from tab indicators and load reveals; scope the transform-only rule to tab indicators and entrance/reveal motion, and allow grid-template-rows animation only for disclosable sections.
  note_zh: FAQ/可展开内容的展开是与 tab 指示器、加载揭示不同的交互上下文；应将仅 transform 的规则限定到 tab 指示器与入场/揭示动效，并仅允许为可展开区块使用 grid-template-rows 动画。
