ai_explanation_zh: l1c1 禁止在地点/产品/服务页面绘制或插图化超过图标大小的对象、地点和产品，而 l1c2 明确允许 3D/WebGL 图表和小型图表视觉元素（如带分支的枢纽）。两者在同一范围内直接矛盾：一个禁止图标以上的绘制/图形，另一个授权绘制的图表和 3D 渲染。
