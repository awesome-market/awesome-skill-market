ai_explanation: "EN: Rule hallma-575 fixes disabled controls at opacity 0.55 as the base value, while rule color-l0c3-component-variants-and-states requires every button to implement all states (default, hover, active, focus-visible, disabled, aria-disabled, busy, quiet) with transitions applied to other states only. A strict reading of hallma-575 pins the disabled state at 0.55 opacity and forbids treating it as a base for transitions, which directly conflicts with the requirement that disabled/aria-disabled states participate in the same transition system. A reasonable scope-split resolves them: keep 0.55 opacity as the disabled/aria-disabled base value, but allow transitions to apply to the non-disabled states (default, hover, active, focus-visible, busy) while leaving disabled transitions off."
ai_explanation_zh: hallma-575 将禁用控件固定为 0.55 透明度作为基础值，而 color-l0c3-component-variants-and-states 要求每个按钮实现所有状态（默认、悬停、激活、可见焦点、禁用、aria-disabled、忙碌、安静）并对其他状态应用过渡。严格解读 hallma-575 会禁止将禁用状态作为过渡的基础，这与禁用/aria-disabled 状态需参与同一过渡系统的要求直接冲突。通过作用域划分可合理解决：将 0.55 透明度保留为禁用/aria-disabled 状态的基础值，同时允许过渡应用于非禁用状态（默认、悬停、激活、可见焦点、忙碌），而禁用状态不应用过渡。
suggestion:
  kind: keep-a
  note: 0.55 opacity is the disabled/aria-disabled base value; transitions apply only to other states.
  note_zh: 0.55 透明度作为禁用/aria-disabled 状态的基础值，过渡仅应用于其他状态。
